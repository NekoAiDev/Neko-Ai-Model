/* ========== 渲染页面 ========== */
function renderPage() {
  const hash = location.hash.slice(1) || 'index';
  const page = PAGES[hash];
  if (!page) { location.hash = 'index'; return; }

  document.getElementById('pageTitle').textContent = page.title;
  document.getElementById('content').innerHTML = page.content;

  // 高亮当前导航
  document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
  const active = document.querySelector(`.nav-item[href="${hash}.html"]`);
  if (active) active.classList.add('active');

  // 关于页：拉取 GitHub 实时数据
  if (hash === 'about') loadGithubData();
}

/* ========== GitHub 实时数据 ========== */
async function loadGithubData() {
  try {
    const res = await fetch('https://api.github.com/repos/NekoAiDev/Neko-Ai-Model');
    const data = await res.json();
    const starsEl = document.getElementById('gh-stars');
    const forksEl = document.getElementById('gh-forks');
    const issuesEl = document.getElementById('gh-issues');
    if (starsEl) starsEl.textContent = data.stargazers_count ?? '--';
    if (forksEl) forksEl.textContent = data.forks_count ?? '--';
    if (issuesEl) issuesEl.textContent = data.open_issues_count ?? '--';
  } catch(e) {}

  try {
    const res = await fetch('https://api.github.com/repos/NekoAiDev/Neko-Ai-Model/contributors');
    const contributors = await res.json();
    const el = document.getElementById('gh-contributors');
    if (el && Array.isArray(contributors)) {
      el.innerHTML = contributors.map(c =>
        `<a href="${c.html_url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);font-size:12px;margin:4px">
          <img src="${c.avatar_url}" style="width:20px;height:20px;border-radius:50%">
          ${c.login}
        </a>`
      ).join('');
    }
  } catch(e) {}
}

/* ========== 主题 ========== */
function toggleDark() {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');

/* ========== 初始化 ========== */
window.addEventListener('hashchange', renderPage);
renderPage();
