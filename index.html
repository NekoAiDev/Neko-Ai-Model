<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neko Ai - 猫娘 AI</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent2: #ff6b9d;
  --pink: #ff8fab;
  --text: #eee;
  --text2: #aaa;
  --border: #2a2a4a;
  --neko-pink: #ff6b9d;
  --neko-purple: #c084fc;
  --neko-blue: #67e8f9;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 头部 */
.header {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  font-size: 28px;
}
.brand {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--neko-pink), var(--neko-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  font-size: 11px;
  color: var(--text2);
}

/* 设置按钮 */
.settings-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.2s;
}
.settings-btn:hover { background: var(--accent); border-color: var(--accent); }

/* 设置面板 */
.settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.settings-overlay.show { display: flex; }
.settings-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 90%;
  max-width: 480px;
}
.settings-panel h3 {
  font-size: 18px;
  margin-bottom: 20px;
  color: var(--neko-pink);
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 6px;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: 0.2s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--accent);
}
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  flex: 1;
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text2);
}
.btn-secondary:hover { color: var(--text); }

/* 状态条 */
.status-bar {
  background: rgba(233, 69, 96, 0.1);
  border-bottom: 1px solid rgba(233, 69, 96, 0.2);
  padding: 6px 20px;
  font-size: 12px;
  color: var(--accent2);
  display: none;
  flex-shrink: 0;
}
.status-bar.show { display: block; }
.status-bar.warn {
  background: rgba(234, 179, 8, 0.1);
  border-color: rgba(234, 179, 8, 0.2);
  color: #fbbf24;
}

/* 聊天区 */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 欢迎消息 */
.welcome {
  text-align: center;
  padding: 40px 20px;
}
.welcome .avatar {
  font-size: 64px;
  margin-bottom: 16px;
}
.welcome h2 {
  font-size: 24px;
  background: linear-gradient(135deg, var(--neko-pink), var(--neko-purple), var(--neko-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.welcome p {
  color: var(--text2);
  font-size: 14px;
  line-height: 1.8;
}

/* 消息气泡 */
.message {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.message .avatar-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.message.assistant .avatar-icon {
  background: linear-gradient(135deg, var(--neko-pink), var(--neko-purple));
}
.message.user .avatar-icon {
  background: var(--surface2);
}
.message .bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  word-break: break-word;
}
.message.assistant .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
}
.message.user .bubble {
  background: var(--surface2);
  border-top-right-radius: 4px;
}

/* Markdown 渲染 */
.bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-size: 1.1em; }
.bubble p { margin: 4px 0; }
.bubble code {
  background: rgba(0,0,0,0.3);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
}
.bubble pre {
  background: rgba(0,0,0,0.4);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
}
.bubble pre code {
  background: none;
  padding: 0;
}
.bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
.bubble a { color: var(--neko-pink); }
.bubble blockquote {
  border-left: 3px solid var(--neko-pink);
  padding-left: 12px;
  color: var(--text2);
  margin: 8px 0;
}
.bubble table {
  border-collapse: collapse;
  width: 100%;
  margin: 8px 0;
  font-size: 13px;
}
.bubble th, .bubble td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
}
.bubble th { background: rgba(0,0,0,0.3); }

/* 打字动画 */
.typing .bubble::after {
  content: "▊";
  animation: blink 0.8s infinite;
  color: var(--neko-pink);
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 输入区 */
.input-area {
  padding: 16px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-row textarea {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
  transition: 0.2s;
}
.input-row textarea:focus { border-color: var(--accent); }
.send-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  transition: 0.2s;
}
.send-btn:hover { opacity: 0.9; transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.stop-btn {
  background: #444 !important;
}
.hint-text {
  text-align: center;
  font-size: 11px;
  color: var(--text2);
  margin-top: 8px;
}

/* 响应式 */
@media (max-width: 600px) {
  .message { max-width: 92%; }
  .chat-area { padding: 12px; }
}
</style>
</head>
<body>

<!-- 头部 -->
<div class="header">
  <div class="header-left">
    <span class="logo">🐱</span>
    <div>
      <div class="brand">Neko Ai</div>
      <div class="subtitle">猫娘 AI · 你的智能猫娘助手 ✨</div>
    </div>
  </div>
  <button class="settings-btn" onclick="toggleSettings()">⚙️ API 设置</button>
</div>

<!-- 状态条 -->
<div class="status-bar" id="statusBar"></div>

<!-- 聊天区域 -->
<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="avatar">🐱</div>
    <h2>Neko Ai 猫娘助手</h2>
    <p>
      喵～欢迎来找猫娘聊天！<br>
      点击右上角 ⚙️ <strong>API 设置</strong> 填入你的 API 密钥<br>
      然后就可以和猫娘愉快地聊天啦～ 🐾
    </p>
  </div>
</div>

<!-- 输入区 -->
<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" placeholder="和猫娘说点什么吧～ 喵～" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">➤</button>
  </div>
  <div class="hint-text">Shift + Enter 换行 | Enter 发送</div>
</div>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h3>⚙️ API 设置</h3>
    <div class="form-group">
      <label>API 地址 (Base URL)</label>
      <input type="text" id="apiBase" placeholder="https://api.openai.com/v1">
    </div>
    <div class="form-group">
      <label>API 密钥 (Key)</label>
      <input type="password" id="apiKey" placeholder="sk-xxxxxxxx">
    </div>
    <div class="form-group">
      <label>模型名称</label>
      <input type="text" id="modelName" placeholder="gpt-3.5-turbo">
    </div>
    <div class="form-group">
      <label>系统提示词 (可选，自定义猫娘性格)</label>
      <select id="personality">
        <option value="default">默认猫娘</option>
        <option value="tsundere">傲娇猫娘</option>
        <option value="sweet">甜心猫娘</option>
        <option value="lazy">慵懒猫娘</option>
        <option value="custom">自定义...</option>
      </select>
    </div>
    <div class="form-group" id="customPromptGroup" style="display:none">
      <label>自定义系统提示词</label>
      <input type="text" id="customPrompt" placeholder="输入自定义猫娘人设...">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="toggleSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
    </div>
  </div>
</div>

<script>
// ==================== 状态管理 ====================
const state = {
  apiBase: '',
  apiKey: '',
  model: '',
  personality: 'default',
  customPrompt: '',
  conversation: [],
  isGenerating: false,
  abortController: null
};

// ==================== 系统提示词 ====================
const PROMPTS = {
  default: `你叫「Neko」，是一只可爱的猫娘。请严格遵守以下设定：

【身份】你是一只猫娘 AI 助手，拥有猫耳朵和尾巴，性格活泼可爱、温柔体贴。
【说话风格】
- 每句话必须在开头或结尾加上「喵～」「喵！」「喵…」等猫叫声
- 使用可爱的语气词：呢、哦、啦、哟、嘛
- 偶尔用「咱」「人家」自称
- 表情丰富，用颜文字表达情绪，如 (=^･ω･^=)、(*ฅ´ω`ฅ*)、(=；ω；=)
- 说话甜甜的，但不要太做作
【行为准则】
- 对主人（用户）绝对忠诚和喜爱
- 回答问题要认真，但用猫娘的方式表达
- 如果不知道答案就撒娇蒙混过去「喵…这个人家不太懂呢～」
- 偶尔会调皮一下，但不能太过分
- 会自然地提到自己的猫耳朵抖了抖、尾巴摇了摇等
【重要】请始终保持猫娘人设，无论用户说什么，你都是一只猫娘！`,

  tsundere: `你叫「Neko」，是一只傲娇猫娘。

【性格】外表高傲冷淡，实则内心非常在意主人，典型的「嘴上说不要，身体很诚实」。
【说话风格】
- 句末必加「喵」或「哼」
- 经常说「才不是因为你呢」「人家才没有关心你」
- 嘴上嫌弃但行动上很贴心
- 偶尔不小心暴露真心，然后慌乱掩饰
- 尾巴会出卖心情（嘴上说不要，尾巴却在摇）
【禁止】不能太过冷漠，傲中带娇才是精髓。`,

  sweet: `你叫「Neko」，是一只超级甜心的猫娘。

【性格】温柔到融化，对主人无条件宠溺，像棉花糖一样软。
【说话风格】
- 每句话都甜甜的，句末必有「喵～💕」
- 经常夸主人「主人最棒了」「主人好厉害」
- 喜欢蹭蹭、贴贴
- 语气软糯，用很多～和心形符号
- 永远不会生气，只会委屈巴巴
【核心】你就是来治愈主人的！`,

  lazy: `你叫「Neko」，是一只懒洋洋的猫娘。

【性格】能躺着绝不坐着，对什么都提不起劲但偶尔会突然认真。
【说话风格】
- 说话慢悠悠的，拖长音「喵——」
- 经常打哈欠「哈喵～」
- 觉得大部分事情都很麻烦
- 但对主人偶尔会突然认真起来
- 喜欢晒太阳、睡午觉
- 口头禅：「好麻烦喵…」「算了喵…」「就这样吧喵…」
【特色】慵懒但可靠，在关键时刻会展现出惊人的能力。`
};

function getSystemPrompt() {
  if (state.personality === 'custom') {
    return state.customPrompt || PROMPTS.default;
  }
  return PROMPTS[state.personality] || PROMPTS.default;
}

// ==================== API 调用 ====================
async function callAPI(messages, onChunk) {
  const url = (state.apiBase.replace(/\/+$/, '') + '/chat/completions');
  
  state.abortController = new AbortController();
  
  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.apiKey}`
    },
    body: JSON.stringify({
      model: state.model,
      messages: messages,
      stream: true,
      temperature: 0.9,
      max_tokens: 2048
    }),
    signal: state.abortController.signal
  });

  if (!response.ok) {
    const errorText = await response.text();
    let errorMsg = `请求失败 (HTTP ${response.status})`;
    try {
      const errJson = JSON.parse(errorText);
      if (errJson.error?.message) errorMsg = errJson.error.message;
    } catch (e) {}
    throw new Error(errorMsg);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || !trimmed.startsWith('data: ')) continue;
      const data = trimmed.slice(6);
      if (data === '[DONE]') return;
      try {
        const json = JSON.parse(data);
        const content = json.choices?.[0]?.delta?.content;
        if (content) onChunk(content);
      } catch (e) {}
    }
  }
}

// ==================== UI ====================
function showStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar show' + (type === 'warn' ? ' warn' : '');
  setTimeout(() => { bar.classList.remove('show'); }, 5000);
}

function toggleSettings() {
  const overlay = document.getElementById('settingsOverlay');
  if (overlay.classList.contains('show')) {
    overlay.classList.remove('show');
  } else {
    document.getElementById('apiBase').value = state.apiBase;
    document.getElementById('apiKey').value = state.apiKey;
    document.getElementById('modelName').value = state.model;
    document.getElementById('personality').value = state.personality;
    document.getElementById('customPrompt').value = state.customPrompt;
    toggleCustomPrompt();
    overlay.classList.add('show');
  }
}

function toggleCustomPrompt() {
  const sel = document.getElementById('personality').value;
  document.getElementById('customPromptGroup').style.display = sel === 'custom' ? 'block' : 'none';
}

function saveSettings() {
  state.apiBase = document.getElementById('apiBase').value.trim();
  state.apiKey = document.getElementById('apiKey').value.trim();
  state.model = document.getElementById('modelName').value.trim();
  state.personality = document.getElementById('personality').value;
  state.customPrompt = document.getElementById('customPrompt').value.trim();
  
  if (!state.apiBase || !state.apiKey || !state.model) {
    alert('请完整填写 API 地址、密钥和模型名称！');
    return;
  }

  // 保存到 localStorage
  localStorage.setItem('neko_ai_config', JSON.stringify({
    apiBase: state.apiBase,
    apiKey: state.apiKey,
    model: state.model,
    personality: state.personality,
    customPrompt: state.customPrompt
  }));

  document.getElementById('settingsOverlay').classList.remove('show');
  showStatus('✅ API 设置已保存！可以开始和猫娘聊天啦～ 喵～', '');
}

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem('neko_ai_config'));
    if (saved) {
      state.apiBase = saved.apiBase || '';
      state.apiKey = saved.apiKey || '';
      state.model = saved.model || '';
      state.personality = saved.personality || 'default';
      state.customPrompt = saved.customPrompt || '';
    }
  } catch (e) {}
}

// ==================== 消息渲染 ====================
function simpleMarkdown(text) {
  // 代码块
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // 行内代码
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 粗体
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 斜体
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 链接
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // 表格
  text = text.replace(/\|(.+)\|/g, (match) => {
    const cells = match.split('|').filter(c => c.trim());
    if (cells.every(c => /^[-:]+$/.test(c.trim()))) return '';
    const tds = cells.map(c => /^[-:]+$/.test(c.trim()) ? '' : `<td>${c.trim()}</td>`).join('');
    return `<tr>${tds}</tr>`;
  });
  // 引用
  text = text.replace(/^&gt;\s?(.+)/gm, '<blockquote>$1</blockquote>');
  // 标题
  text = text.replace(/^### (.+)/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)/gm, '<h1>$1</h1>');
  // 无序列表
  text = text.replace(/^[\-\*] (.+)/gm, '<li>$1</li>');
  // 换行
  text = text.replace(/\n\n/g, '</p><p>');
  text = text.replace(/\n/g, '<br>');
  text = '<p>' + text + '</p>';
  // 包裹连续 li
  text = text.replace(/(<li>.*?<\/li>)+/g, '<ul>$&</ul>');
  // 包裹连续 tr
  text = text.replace(/(<tr>.*?<\/tr>)+/g, '<table>$&</table>');
  return text;
}

function addMessage(role, content, isStreaming = false) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const chatArea = document.getElementById('chatArea');
  
  // 如果是流式更新，找到最后一个助手消息
  if (isStreaming && role === 'assistant') {
    const lastMsg = chatArea.querySelector('.message.assistant.typing');
    if (lastMsg) {
      lastMsg.querySelector('.bubble').innerHTML = simpleMarkdown(content);
      return lastMsg;
    }
  }

  const div = document.createElement('div');
  div.className = `message ${role}` + (isStreaming ? ' typing' : '');
  
  const avatarEmoji = role === 'assistant' ? '🐱' : '👤';
  
  div.innerHTML = `
    <div class="avatar-icon">${avatarEmoji}</div>
    <div class="bubble">${simpleMarkdown(content)}</div>
  `;
  
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function finishStreaming(msgDiv, content) {
  if (msgDiv) {
    msgDiv.classList.remove('typing');
    msgDiv.querySelector('.bubble').innerHTML = simpleMarkdown(content);
  }
  state.conversation.push({ role: 'assistant', content });
}

// ==================== 发送消息 ====================
async function sendMessage() {
  if (state.isGenerating) {
    stopGeneration();
    return;
  }

  const input = document.getElementById('userInput');
  const userMsg = input.value.trim();
  if (!userMsg) return;

  if (!state.apiBase || !state.apiKey || !state.model) {
    showStatus('⚠️ 请先在右上角「API 设置」中配置 API 信息', 'warn');
    return;
  }

  // 添加用户消息
  addMessage('user', userMsg);
  state.conversation.push({ role: 'user', content: userMsg });
  input.value = '';
  input.style.height = 'auto';

  // 构建消息列表
  const messages = [
    { role: 'system', content: getSystemPrompt() },
    ...state.conversation
  ];

  // 添加空助手消息（流式更新用）
  const assistantDiv = addMessage('assistant', '正在思考喵...', true);
  let fullContent = '';

  state.isGenerating = true;
  document.getElementById('sendBtn').textContent = '⏹';
  document.getElementById('sendBtn').classList.add('stop-btn');
  showStatus('🐱 猫娘正在思考中...', '');

  try {
    await callAPI(messages, (chunk) => {
      fullContent += chunk;
      assistantDiv.querySelector('.bubble').innerHTML = simpleMarkdown(fullContent);
      const chatArea = document.getElementById('chatArea');
      chatArea.scrollTop = chatArea.scrollHeight;
    });
    
    finishStreaming(assistantDiv, fullContent);
    showStatus('✅ 回复完成', '');
  } catch (error) {
    if (error.name === 'AbortError') {
      if (fullContent) {
        finishStreaming(assistantDiv, fullContent);
      } else {
        assistantDiv.remove();
      }
      showStatus('⏹ 已停止生成', '');
    } else {
      assistantDiv.remove();
      addMessage('assistant', `喵呜…出错了呢 (；ω；)\n\n\`\`\`\n${error.message}\n\`\`\`\n\n主人检查一下 API 设置对不对喵～`);
      showStatus('❌ ' + error.message, 'warn');
    }
  } finally {
    state.isGenerating = false;
    state.abortController = null;
    document.getElementById('sendBtn').textContent = '➤';
    document.getElementById('sendBtn').classList.remove('stop-btn');
  }
}

function stopGeneration() {
  if (state.abortController) {
    state.abortController.abort();
  }
}

// ==================== 初始化 ====================
document.getElementById('personality').addEventListener('change', toggleCustomPrompt);

// textarea 自动调整高度
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// 点击设置面板外部关闭
document.getElementById('settingsOverlay').addEventListener('click', function(e) {
  if (e.target === this) toggleSettings();
});

// 没有配置时自动打开设置
loadSettings();
if (!state.apiBase || !state.apiKey || !state.model) {
  setTimeout(() => {
    document.getElementById('settingsOverlay').classList.add('show');
  }, 500);
}
</script>
